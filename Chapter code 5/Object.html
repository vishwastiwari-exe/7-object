<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>
    <script>
        let Product = {
            Company: 'Apple',
            item_name: 'cotton striped t-shirt',
            price: 500,
        }
        
        console.log(Product.Company);
        console.log(Product.item_name);
        console.log(Product.price);

        console.log(Product['Company']);
        console.log(Product['item_name']);
        console.log(Product['price']);

        let propertyName = 'Company';
        console.log(Product[propertyName]);

        delete Product.price;
        console.log(Product.price);


        //inside object

         let product = {
            Company: 'Apple',
            item_name: 'cotton striped t-shirt',
            price: 500,
            rating: {
                rate: 4.5,
                noofReviews: 1000,
            },
            displayPrice: function(){
                console.log(`Price is ${this.price}`);
            }
        };
        product.displayPrice();


        //Autoboxing
        console.log('This is a string'.length);
        console.log('This is KG Coding'.replace('KG Coding', 'vishwas coding'));


        //object reference
        let a=5;
        let b=a;
        console.log(`a: ${a}, b: ${b}`);
        a = 9;
        console.log(`a: ${a}, b: ${b}`);


        let x = {num: 5};
        let y = x;
        console.log(`x: ${x.num}, y: ${y.num}`);
        x.num = 9;
        console.log(`x: ${x.num}, y: ${y.num}`);

        
        let p = {pop: 'iujh'};
        let q = {pop: 'iujh'};
        console.log(p == q);
        console.log(p === q);
    </script>
</body>
</html>
